<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760">
  <rect width="360" height="760" rx="36" fill="#ffffff"/>
  <rect width="360" height="760" rx="36" fill="#f7f5ff"/>
  <rect x="0" y="0" width="360" height="60" fill="#ffffff"/>
  <text x="30" y="38" font-family="sans-serif" font-size="13" fill="#625b71">Back</text>
  <text x="180" y="38" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1b24" text-anchor="middle">Analysis</text>
  <!-- progress card -->
  <rect x="30" y="90" width="300" height="150" rx="16" fill="#ffffff" stroke="#e0d9f0"/>
  <text x="50" y="126" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1b24">Analyzing sample.apk</text>
  <rect x="50" y="150" width="260" height="8" rx="4" fill="#ece6ff"/>
  <rect x="50" y="150" width="168" height="8" rx="4" fill="#6650a4"/>
  <text x="50" y="180" font-family="sans-serif" font-size="12" fill="#625b71">Stage 4 of 9 - Signing analysis</text>
  <!-- stages -->
  <g font-family="sans-serif" font-size="13">
    <circle cx="50" cy="220" r="7" fill="#4caf7d"/>
    <text x="66" y="225" fill="#3c3355">APK structure</text>
    <circle cx="50" cy="252" r="7" fill="#4caf7d"/>
    <text x="66" y="257" fill="#3c3355">Metadata &amp; manifest</text>
    <circle cx="50" cy="284" r="7" fill="#4caf7d"/>
    <text x="66" y="289" fill="#3c3355">Certificate &amp; signature</text>
    <circle cx="50" cy="316" r="7" fill="#ffb74d"/>
    <text x="66" y="321" fill="#3c3355">DEX inspection</text>
    <circle cx="50" cy="348" r="7" fill="#e0d9f0"/>
    <text x="66" y="353" fill="#9b93b5">Code &amp; IOC extraction</text>
  </g>
  <!-- isolated engine note -->
  <rect x="30" y="600" width="300" height="56" rx="12" fill="#ece6ff"/>
  <text x="48" y="624" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4a3f78">Isolated analysis engine</text>
  <text x="48" y="644" font-family="sans-serif" font-size="11" fill="#625b71">Runs in a sandboxed process. Nothing is executed.</text>
</svg>