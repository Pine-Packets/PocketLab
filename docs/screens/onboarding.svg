<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760">
  <rect width="360" height="760" rx="36" fill="#ffffff"/>
  <rect width="360" height="760" rx="36" fill="#f7f5ff"/>
  <!-- gradient hero -->
  <defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6650a4"/><stop offset="1" stop-color="#4a3f78"/></linearGradient></defs>
  <rect width="360" height="240" rx="36" fill="url(#hero)"/>
  <!-- shield icon -->
  <path d="M180 60 l54 18 v40 c0 46 -22 74 -54 92 c-32 -18 -54 -46 -54 -92 v-40 z" fill="#ffffff" opacity="0.18"/>
  <path d="M180 80 l40 13 v30 c0 34 -16 56 -40 70 c-24 -14 -40 -36 -40 -70 v-30 z" fill="#ffffff"/>
  <text x="180" y="104" font-family="sans-serif" font-size="16" fill="#6650a4" text-anchor="middle" font-weight="bold">PL</text>
  <text x="180" y="268" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">PocketLab</text>
  <text x="180" y="294" font-family="sans-serif" font-size="14" fill="#d9d0ff" text-anchor="middle">Your files stay on your device</text>
  <!-- checklist -->
  <g font-family="sans-serif" font-size="14">
    <text x="40" y="360" font-weight="bold" fill="#1a1b24">Analyze. Never execute.</text>
    <circle cx="60" cy="400" r="12" fill="#6650a4"/>
    <text x="60" y="405" fill="#ffffff" text-anchor="middle" font-size="12">✓</text>
    <text x="82" y="404" fill="#3c3355">Static analysis only</text>
    <circle cx="60" cy="440" r="12" fill="#6650a4"/>
    <text x="60" y="445" fill="#ffffff" text-anchor="middle" font-size="12">✓</text>
    <text x="82" y="444" fill="#3c3355">Runs in an isolated process</text>
    <circle cx="60" cy="480" r="12" fill="#6650a4"/>
    <text x="60" y="485" fill="#ffffff" text-anchor="middle" font-size="12">✓</text>
    <text x="82" y="484" fill="#3c3355">100% offline</text>
  </g>
  <rect x="120" y="620" width="120" height="44" rx="22" fill="#6650a4"/>
  <text x="180" y="648" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Get started</text>
</svg>